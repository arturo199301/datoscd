name: Ejecutor de Web Diario

# 1. CUÁNDO SE EJECUTA
on:
  schedule:
    - cron: '0 05 * * *'  # Se ejecuta automáticamente todos los días a las 5:00 AM
  workflow_dispatch:      # Permite activar el script manualmente con un botón

# 2. QUÉ HACE LA MÁQUINA VIRTUAL
jobs:
  job_scraping:
    runs-on: ubuntu-latest  # Usa un servidor Linux gratuito

    steps:
      # Paso A: Descargar nuestro código del repositorio
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # Paso B: Instalar Python en la máquina virtual
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Paso C: Instalar las librerías necesarias
      # Las librerías deben coincidir con nuestro Colab
      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas

      # Paso D: Ejecutar nuestro script de Python
      - name: Ejecutar script de Web 
        run: python texto.py

      # Paso E: Guardar y subir el archivo CSV generado al repositorio
      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Actualización automática del CSV por GitHub Actions" || exit 0
          git push
